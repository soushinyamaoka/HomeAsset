schema_version: 1
app: homeasset

canonical_repo: https://github.com/soushinyamaoka/HomeAsset.git
canonical_ref: main
updated_at: 2026-09-02
# 全項目の実機照合は未完了のため null を維持（2026-08-31のVPS管理側事後確認で一部項目は裏付けが取れたが、
# 網羅的な照合ではないため verified_against_runtime は引き上げない）。
verified_against_runtime: null

runtime:
  type: docker-compose
  unit: api                                  # docker-compose.prod.yml の service名
  # compose project名: homeasset（VPS管理側の事後確認で確認済み。docker-compose.prod.ymlにname指定は無く、
  # 配置先ディレクトリ名 homeasset から決定されている。volume名 homeasset_homeasset_pgdata とも整合）
  working_directory: /home/deploy/homeasset  # docker compose を実行するhost側ディレクトリ（VPS管理側の事後確認で確認済み）
  # コンテナ内部のWORKDIRは apps/api/Dockerfile より /app/apps/api（VPS管理側の事後確認と一致）
  user: root
  group: root
  language_runtime: node20
  os_packages: [openssl]
  restart_policy: unless-stopped             # docker-compose.prod.yml および VPS管理側の事後確認と一致

network:
  listeners:
    # Composeはホスト側をloopbackに限定し、コンテナ内プロセスは0.0.0.0で待ち受ける。
    - bind: 127.0.0.1
      port: 4001
      protocol: http
  # VPS管理側の正本に基づく（2026-08-31、事後レビューでの提供）。
  public:
    - url: https://homeasset.homehub-tools.dedyn.io
      upstream: 127.0.0.1:4001
      tls: letsencrypt
  health:
    internal:
      path: /health
      expected_status: 200
      auth_required: false
    # VPS管理側の正本に基づく（2026-08-31、事後レビューでの提供）。
    public:
      path: /health
      expected_status: 200

config:
  # docker-compose.prod.yml に env_file 指定は無く、Composeの既定探索（配置先ディレクトリの .env）による。
  # 配置先パス自体はVPS管理側の事後確認で確認済みだが、.env ファイルの実在確認はこの経路からは未実施。
  env_file: /home/deploy/homeasset/.env
  env_vars:
    - { name: POSTGRES_USER, required: true, secret: false }
    - { name: POSTGRES_PASSWORD, required: true, secret: true }
    - { name: POSTGRES_DB, required: true, secret: false }
    - { name: JWT_SECRET, required: true, secret: true }
    - { name: NODE_ENV, required: true, secret: false }
    - { name: PORT, required: true, secret: false }
    - { name: TZ, required: false, secret: false }   # 追加（commit 0f0782d）。apiコンテナへ Asia/Tokyo を設定
    - { name: DATABASE_URL, required: true, secret: true }
    - { name: LOG_LEVEL, required: false, secret: false }
  # デプロイスクリプト（scripts/deploy.ps1）は .env を転送・変更せず、VPS既存の .env をそのまま使用することを
  # VPS管理側で確認済み（2026-08-31、事後レビュー）。
  secret_provisioning: manual

data:
  databases:
    - engine: postgresql
      version: 16
      name: null
  persistent_paths:
    - path: /var/lib/postgresql/data           # postgresコンテナ内のマウント先（docker-compose.prod.yml）
      volume_name: homeasset_homeasset_pgdata  # VPS管理側の事後確認で維持を確認済み
      # backup_requiredは現在の実装状況ではなくバックアップの必要性を表す。HomeAsset PostgreSQLはバックアップ
      # 対象（VPS管理側判定、2026-08-31）。ただし定期backupの仕組み自体は未整備（下記未解決事項参照）。
      backup_required: true
      regenerable: false
  migrations: automatic

jobs: []

dependencies:
  internal: [postgres]
  external: []

deploy:
  entry: npm run deploy   # scripts/deploy.ps1 → ssh経由で docker compose -f docker-compose.prod.yml up -d --build api
  downtime: brief-restart
  # 旧imageの保存・実際のrollback動作は未検証。20260902-HOMEASSET-002のproduction反映前に、
  # VPS管理側が現行source/imageの保全と具体的な復旧・health確認手順を実施計画で確定する。
  rollback: null

logging:
  destinations: [stdout]
  # apiコンテナのDocker log driverはjson-file（VPS管理側の事後確認と一致。docker-compose.prod.ymlに
  # logging:ドライバ指定は無いためDocker既定）。
  #
  # Prisma CLI・npm由来の非JSON行は解消済み。entrypointがmigration出力を構造化eventへ変換し、
  # 成功系・失敗系ともcontainerの全出力が1行JSONであることをローカル検証した。
  # 2026-09-02のproduction反映後、起動ログ8行すべてのJSON parse成功と必須field、migration成功を確認した。
  # 詳細: ops/server-change-notices/20260902-HOMEASSET-002-summary.md参照。
  format: structured
  schema_version: 1
  contains_pii: false
  rotation: null   # json-fileドライバでサイズ上限設定なし（docker-compose.prod.ymlに未指定のためDocker既定）

user_impact:
  direct_users: true
  client_apps: [HomeAsset mobile]
  user_facing_functions: [家庭内資産・住宅設備管理]
